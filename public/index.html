
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORE | Welcome</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#080d19;
color:#fff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.container{
width:100%;
max-width:430px;
text-align:center
}
.logo{
font-size:35px;
font-weight:900;
letter-spacing:4px;
color:#55d6ff;
margin-bottom:12px
}
.subtitle{
color:#a8b2c5;
margin-bottom:35px;
font-size:14px
}
.panel{
background:#111a2c;
border:1px solid #263750;
padding:28px 22px;
border-radius:18px;
box-shadow:0 15px 50px #0005
}
h2{margin-bottom:10px;font-size:24px}
.description{
color:#9daac0;
font-size:14px;
margin-bottom:25px
}
input{
width:100%;
padding:15px;
margin-bottom:14px;
border:1px solid #30415d;
border-radius:10px;
background:#0a1221;
color:white;
font-size:15px;
outline:none
}
input:focus{border-color:#55d6ff}
button{
width:100%;
padding:15px;
border:0;
border-radius:10px;
background:#55d6ff;
color:#07111d;
font-weight:bold;
font-size:16px;
cursor:pointer;
margin-top:5px
}
button:disabled{opacity:.6;cursor:not-allowed}
.switch{
margin-top:22px;
color:#aab8ca;
font-size:14px
}
.switch span{
color:#55d6ff;
cursor:pointer;
font-weight:bold
}
.message{
margin:0 0 15px;
font-size:14px;
color:#ff8585;
line-height:1.5
}
.hidden{display:none}
.footer{
margin-top:25px;
color:#64748b;
font-size:12px
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">NEXORE</div>
  <p class="subtitle">Your account. Your space. Your future.</p>

  <div class="panel">
    <div id="registerBox">
      <h2>Create Account</h2>
      <p class="description">Join NEXORE today</p>

      <form id="registerForm">
        <div class="message" id="registerMessage"></div>

        <input
          type="text"
          id="regUsername"
          placeholder="Username"
          minlength="3"
          maxlength="40"
          autocomplete="username"
          required
        >

        <input
          type="email"
          id="regEmail"
          placeholder="Email address"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="regPassword"
          placeholder="Password (minimum 6 characters)"
          minlength="6"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="registerButton">
          Create Account
        </button>
      </form>

      <p class="switch">
        Already have an account?
        <span id="showLogin">Login</span>
      </p>
    </div>

    <div id="loginBox" class="hidden">
      <h2>Welcome Back</h2>
      <p class="description">Login to your NEXORE account</p>

      <form id="loginForm">
        <div class="message" id="loginMessage"></div>

        <input
          type="text"
          id="loginEmail"
          placeholder="Email or username"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">
          Login
        </button>
      </form>

      <p class="switch">
        Don't have an account?
        <span id="showRegister">Register</span>
      </p>
    </div>
  </div>

  <p class="footer">© 2026 NEXORE. All rights reserved.</p>
</div>

<script>
const registerBox = document.getElementById("registerBox");
const loginBox = document.getElementById("loginBox");

function showLogin() {
  registerBox.classList.add("hidden");
  loginBox.classList.remove("hidden");
}

function showRegister() {
  loginBox.classList.add("hidden");
  registerBox.classList.remove("hidden");
}

document.getElementById("showLogin").addEventListener("click", showLogin);
document.getElementById("showRegister").addEventListener("click", showRegister);

async function sendRequest(url, data, messageElement, button) {
  messageElement.textContent = "";
  button.disabled = true;
  button.textContent = "Please wait...";

  try {
    const response = await fetch(url, {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Request failed. Please try again.");
    }

    if (result.redirect) {
      window.location.assign(result.redirect);
      return;
    }

    throw new Error("Server did not return a redirect.");

  } catch (error) {
    messageElement.textContent = error.message || "Connection failed. Please try again.";
    button.disabled = false;
    button.textContent = url.includes("register") ? "Create Account" : "Login";
  }
}

document.getElementById("registerForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = document.getElementById("regUsername").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;

  sendRequest(
    "/api/register",
    { username, email, password },
    document.getElementById("registerMessage"),
    document.getElementById("registerButton")
  );
});

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  sendRequest(
    "/api/login",
    { email, password },
    document.getElementById("loginMessage"),
    document.getElementById("loginButton")
  );
});

// Check whether an existing session is active.
fetch("/api/me", {
  credentials: "same-origin"
})
.then(response => {
  if (response.ok) {
    window.location.replace("/dashboard");
  }
})
.catch(error => console.log("Session check:", error));
</script>

</body>
</html>
