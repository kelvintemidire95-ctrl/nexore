<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORE | Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080d18;color:#fff;min-height:100vh}
header{height:70px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202b40;background:#0d1423}
.logo{font-size:23px;font-weight:900;letter-spacing:2px;color:#58a6ff}
.logout{background:#1b2940;color:#fff;border:1px solid #34445f;padding:10px 15px;border-radius:9px;cursor:pointer}
main{max-width:900px;margin:35px auto;padding:0 18px}
.welcome{font-size:27px;margin-bottom:8px}
.sub{color:#8c9bb2;margin-bottom:28px}
.card{background:#111c2e;border:1px solid #263650;border-radius:16px;padding:23px;margin-bottom:20px}
.card h3{font-size:15px;color:#9eb0ca;margin-bottom:13px}
.username{font-size:24px;font-weight:bold;overflow-wrap:anywhere}
.status{color:#43d9a3;font-size:13px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.info{background:#111c2e;border:1px solid #263650;border-radius:14px;padding:20px}
.info small{color:#91a2bb}
.info p{font-size:17px;margin-top:10px;overflow-wrap:anywhere}
.loading{color:#9eb0ca;text-align:center;padding:30px}
.error{color:#ff7777;margin-top:15px}
@media(max-width:550px){.grid{grid-template-columns:1fr}main{margin-top:25px}.welcome{font-size:23px}}
</style>
</head>
<body>
<header>
<div class="logo">NEXORE</div>
<button class="logout" id="logoutBtn">Logout</button>
</header>

<main>
<div class="welcome">Welcome to NEXORE 👋</div>
<div class="sub">Your personal dashboard</div>

<div class="card">
<h3>ACCOUNT PROFILE</h3>
<div class="username" id="username">Loading...</div>
<div class="status">● Account connected</div>
</div>

<div class="grid">
<div class="info">
<small>Username</small>
<p id="userNameInfo">Loading...</p>
</div>
<div class="info">
<small>Email address</small>
<p id="emailInfo">Loading...</p>
</div>
<div class="info">
<small>Account status</small>
<p>Active</p>
</div>
<div class="info">
<small>Platform</small>
<p>NEXORE</p>
</div>
</div>

<div class="error" id="error"></div>
</main>

<script>
async function loadDashboard(){
 const error=document.getElementById("error");
 try{
  const response=await fetch("/api/me",{
   method:"GET",
   credentials:"same-origin",
   headers:{"Accept":"application/json"}
  });

  const result=await response.json();

  if(!response.ok || !result.success){
   window.location.replace("/");
   return;
  }

  const user=result.user || result;
  const username=user.username || "User";
  const email=user.email || "Not available";

  document.getElementById("username").textContent=username;
  document.getElementById("userNameInfo").textContent=username;
  document.getElementById("emailInfo").textContent=email;

 }catch(e){
  error.textContent="Could not load your account. Please refresh the page.";
 }
}

document.getElementById("logoutBtn").addEventListener("click",async()=>{
 const button=document.getElementById("logoutBtn");
 button.disabled=true;
 button.textContent="Logging out...";
 try{
  const response=await fetch("/api/logout",{
   method:"POST",
   credentials:"same-origin"
  });
  if(response.ok){
   window.location.replace("/");
  }else{
   button.disabled=false;
   button.textContent="Logout";
   alert("Logout failed. Please try again.");
  }
 }catch(e){
  button.disabled=false;
  button.textContent="Logout";
  alert("Connection error. Please try again.");
 }
});

loadDashboard();
</script>
</body>
</html>
